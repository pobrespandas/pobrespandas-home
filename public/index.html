<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pobres Pandas — Toda la vida masticando bambú. Lo que es yo, yo quiero todo el menú.">
  <meta name="theme-color" content="#f4f2ec">
  <title>Pobres Pandas</title>
  <style>
    :root {
      --paper: #f4f2ec;
      --ink: #11110f;
      --muted: #77766f;
      --line: #c9c7bf;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    a { color: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0 clamp(20px, 3vw, 48px);
    }

    header {
      height: 86px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .brand { font-weight: 700; text-decoration: none; }
    .edition { color: var(--muted); }
    .status { justify-self: end; display: flex; align-items: center; gap: 9px; }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(56px, 8vh, 110px) 0;
    }
    .slogan {
      margin: 0;
      font-size: clamp(50px, 8.6vw, 138px);
      font-weight: 400;
      line-height: .94;
      letter-spacing: -.065em;
    }
    .line { display: block; }
    .line:first-child { max-width: 12em; }
    .line:last-child {
      max-width: 10.8em;
      margin-top: .18em;
      margin-left: auto;
      text-align: right;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      letter-spacing: -.07em;
    }
    .slash { font-family: Arial, Helvetica, sans-serif; font-style: normal; color: var(--muted); }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      align-items: end;
      margin-top: clamp(70px, 12vh, 150px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .detail {
      font-size: 11px;
      line-height: 1.45;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .detail:nth-child(2) { text-align: center; color: var(--muted); }
    .detail:last-child { text-align: right; }

    footer {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .monogram {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: -.12em;
      line-height: 1;
    }

    @media (max-width: 700px) {
      header { height: 70px; grid-template-columns: 1fr auto; }
      .edition { display: none; }
      main { justify-content: space-between; padding: 50px 0 28px; }
      .slogan { font-size: clamp(48px, 15.2vw, 90px); line-height: .95; }
      .line:last-child { margin-top: .65em; margin-left: 0; text-align: left; }
      .details { grid-template-columns: 1fr auto; margin-top: 90px; }
      .detail:nth-child(2) { display: none; }
      footer span:first-child { max-width: 220px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">Pobres Pandas</a>
      <span class="edition">Edición digital — 001</span>
      <span class="status">Con hambre</span>
    </header>

    <main>
      <h1 class="slogan">
        <span class="line">Toda la vida masticando bambú</span>
        <span class="line"><span class="slash">/</span> lo que es yo, yo quiero todo el menú</span>
      </h1>

      <div class="details" aria-label="Acerca de Pobres Pandas">
        <div class="detail">Ideas · Diseño · Código</div>
        <div class="detail">Sin dieta creativa</div>
        <div class="detail">Hecho en internet</div>
      </div>
    </main>

    <footer>
      <span>Una publicación de Pobres Pandas</span>
      <span class="monogram" aria-label="Pobres Pandas">PP</span>
    </footer>
  </div>
</body>
</html>
